apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: ratel-backend-users
  namespace: ratel-backend

spec:
  parentRefs:
    - name: ratel-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/users

      backendRefs:
        - name: ratel-backend-users
          port: 9000

    - matches:
        - path:
            type: Exact
            value: /dev/swagger/users
        - path:
            type: Exact
            value: /dev/swagger/users/

      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /dev/swagger/users/index.html
            statusCode: 302

    - matches:
        - path:
            type: PathPrefix
            value: /dev/swagger/users

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /swagger

      backendRefs:
        - name: ratel-backend-users
          port: 9000
