services:
  ratel-quay-cache:
    image: registry:3
    container_name: ratel-quay-cache
    restart: unless-stopped

#    ports:
#      - "127.0.0.1:5002:5000"
#      - "[::1]:5002:5000"

    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_PROXY_REMOTEURL: https://quay.io
      REGISTRY_PROXY_TTL: "0"
      OTEL_TRACES_EXPORTER: none

    volumes:
      - ratel-quay-cache-data:/var/lib/registry

    networks:
      kind:
        aliases:
          - ratel-quay-cache

volumes:
  ratel-quay-cache-data:

networks:
  kind:
    external: true
    name: kind
